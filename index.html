<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沖水馬桶</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #e3f2fd 0%, #90caf9 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        h1 {
            color: #1565c0;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .toilet-container {
            position: relative;
            width: 300px;
            height: 400px;
        }

        /* 馬桶 */
        .toilet {
            position: relative;
            width: 200px;
            height: 280px;
            margin: 0 auto;
        }

        .toilet-bowl {
            width: 180px;
            height: 160px;
            background: white;
            border: 8px solid #e0e0e0;
            border-radius: 50% 50% 40% 40%;
            position: absolute;
            bottom: 60px;
            left: 10px;
            box-shadow: 
                inset 0 10px 30px rgba(33, 150, 243, 0.3),
                0 10px 30px rgba(0,0,0,0.2);
        }

        .toilet-bowl-inner {
            width: 100px;
            height: 80px;
            background: linear-gradient(to bottom, #2196f3, #1976d2);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -40%);
            animation: water-idle 3s ease-in-out infinite;
        }

        @keyframes water-idle {
            0%, 100% { transform: translate(-50%, -40%) scale(1); }
            50% { transform: translate(-50%, -40%) scale(1.02); }
        }

        .toilet-base {
            width: 200px;
            height: 80px;
            background: white;
            border: 8px solid #e0e0e0;
            border-radius: 20px;
            position: absolute;
            bottom: 0;
            left: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .toilet-lid {
            width: 180px;
            height: 20px;
            background: white;
            border: 6px solid #e0e0e0;
            border-radius: 50%;
            position: absolute;
            top: -10px;
            left: 10px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
        }

        /* 沖水按鈕 */
        .flush-button {
            width: 50px;
            height: 50px;
            background: linear-gradient(145deg, #42a5f5, #1976d2);
            border: none;
            border-radius: 50%;
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            box-shadow: 
                0 5px 15px rgba(25, 118, 210, 0.4),
                inset 0 -2px 5px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            font-size: 20px;
        }

        .flush-button:hover {
            background: linear-gradient(145deg, #1e88e5, #1565c0);
            transform: scale(1.05);
            box-shadow: 0 7px 20px rgba(25, 118, 210, 0.6);
        }

        .flush-button:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(25, 118, 210, 0.4);
        }

        .flush-text {
            color: white;
            font-size: 12px;
            font-weight: bold;
            margin-top: 5px;
        }

        /* 沖水動畫 */
        @keyframes flush {
            0% {
                transform: translate(-50%, -40%) scale(1) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -40%) scale(0.8) rotate(180deg);
                opacity: 0.5;
            }
            100% {
                transform: translate(-50%, -40%) scale(0.3) rotate(360deg);
                opacity: 0;
            }
        }

        .flushing .toilet-bowl-inner {
            animation: flush 1s ease-in-out;
        }

        /* 水花效果 */
        .water-splash {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #2196f3;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes splash {
            0% {
                transform: translate(0, 0) scale(0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(1);
                opacity: 0;
            }
        }

        .instructions {
            margin-top: 50px;
            text-align: center;
            color: #1565c0;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🚽 互動式馬桶</h1>
    
    <div class="toilet-container">
        <div class="toilet">
            <div class="toilet-lid"></div>
            <div class="toilet-bowl">
                <div class="toilet-bowl-inner"></div>
            </div>
            <div class="toilet-base"></div>
        </div>
        
        <button class="flush-button" id="flushBtn" title="按下沖水">
            💧
            <div class="flush-text">沖水</div>
        </button>
    </div>

    <div class="instructions">
        👆 按下沖水按鈕試試看！
    </div>

    <script>
        const flushBtn = document.getElementById('flushBtn');
        const toilet = document.querySelector('.toilet');
        const toiletBowl = document.querySelector('.toilet-bowl');

        flushBtn.addEventListener('click', function() {
            // 添加沖水動畫
            toilet.classList.add('flushing');
            
            // 創建水花效果
            for (let i = 0; i < 12; i++) {
                createSplash();
            }
            
            // 播放沖水音效（如果需要可以添加）
            
            // 1秒後導向到指定網址
            setTimeout(function() {
                // 🔽 修改這裡的網址為你想要的目標網址
                window.location.href = 'https://www.google.com';
            }, 1000);
        });

        function createSplash() {
            const splash = document.createElement('div');
            splash.className = 'water-splash';
            
            const angle = Math.random() * Math.PI * 2;
            const distance = 50 + Math.random() * 100;
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;
            
            splash.style.setProperty('--tx', tx + 'px');
            splash.style.setProperty('--ty', ty + 'px');
            splash.style.left = '50%';
            splash.style.top = '50%';
            splash.style.animation = 'splash 0.8s ease-out forwards';
            
            toiletBowl.appendChild(splash);
            
            setTimeout(() => splash.remove(), 800);
        }
    </script>
</body>
</html>
